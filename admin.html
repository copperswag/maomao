<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>毛毛星球 | 运营数据与管理中台</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-main: #f0f6fc;
      --green: #2ea043;
      --green-light: #3fb950;
      --red: #da3633;
      --blue: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-refresh {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-refresh:hover { background: #30363d; }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
    }

    .card-sub {
      font-size: 12px;
      color: #8b949e;
      margin-top: 6px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 800px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .room-bar-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .room-bar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .room-bar-label { width: 90px; }
    .room-bar-track {
      flex: 1;
      height: 10px;
      background: #21262d;
      border-radius: 99px;
      overflow: hidden;
    }
    .room-bar-fill {
      height: 100%;
      background: var(--green-light);
      border-radius: 99px;
    }
    .room-bar-val { width: 50px; text-align: right; color: var(--text-main); font-weight: 600; }

    .input-box {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    .input-box:focus { border-color: var(--green-light); }

    .btn-action {
      background: var(--green);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-action:hover { background: var(--green-light); }

    .btn-danger {
      background: #21262d;
      border: 1px solid var(--red);
      color: #ff7b72;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover { background: var(--red); color: #fff; }

    .select-room {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .comment-list {
      max-height: 360px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }

    .comment-row {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .c-user { color: var(--green-light); font-weight: 600; margin-right: 6px; }
    .c-text { color: var(--text-main); }
    .c-time { color: #8b949e; font-size: 11px; margin-left: 8px; }

    /* 密码登录遮罩 */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 17, 23, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .auth-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      width: 360px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 登录校验弹窗 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h3 style="color: var(--text-main); margin-bottom: 8px;">🔐 管理员鉴权</h3>
      <p style="font-size: 13px; color: #8b949e; margin-bottom: 20px;">请输入毛毛星球中台管理密钥</p>
      <input type="password" class="input-box" id="adminKeyInput" placeholder="输入密钥..." />
      <button class="btn-action" style="width: 100%;" id="btnAuth">进入中台</button>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="header-title">
        <span>🐾</span>
        <span>毛毛星球 MeowHub · 运营中台</span>
      </div>
      <button class="btn-refresh" id="btnRefresh">🔄 刷新数据</button>
    </header>

    <!-- 4 个核心流量与转化卡片 -->
    <div class="grid-4">
      <div class="card">
        <div class="card-title">今日独立访客 (UV) <span>👥</span></div>
        <div class="card-num" id="uvToday">0</div>
        <div class="card-sub">历史累计 UV：<span id="uvTotal">0</span></div>
      </div>
      <div class="card">
        <div class="card-title">今日页面浏览 (PV) <span>👁️</span></div>
        <div class="card-num" id="pvToday">0</div>
        <div class="card-sub">历史累计 PV：<span id="pvTotal">0</span></div>
      </div>
      <div class="card">
        <div class="card-title">App 导流点击数 <span>📲</span></div>
        <div class="card-num" id="appToday" style="color: var(--green-light);">0</div>
        <div class="card-sub">累计导流：<span id="appTotal">0</span> 次</div>
      </div>
      <div class="card">
        <div class="card-title">真实互动总量 <span>💬</span></div>
        <div class="card-num" id="commTotal" style="color: var(--blue);">0</div>
        <div class="card-sub">拍立得生成：<span id="snapTotal">0</span> | 吸猫：<span id="likeTotal">0</span></div>
      </div>
    </div>

    <!-- 中部：机位热度与运营广播 -->
    <div class="grid-2">
      <div class="card">
        <div class="section-title">📍 机位访问热度排行</div>
        <div class="room-bar-group">
          <div class="room-bar-item">
            <div class="room-bar-label">苏州猫岛</div>
            <div class="room-bar-track"><div class="room-bar-fill" id="bar1" style="width: 0%;"></div></div>
            <div class="room-bar-val" id="val1">0</div>
          </div>
          <div class="room-bar-item">
            <div class="room-bar-label">沛霖</div>
            <div class="room-bar-track"><div class="room-bar-fill" id="bar2" style="width: 0%;"></div></div>
            <div class="room-bar-val" id="val2">0</div>
          </div>
          <div class="room-bar-item">
            <div class="room-bar-label">南庄</div>
            <div class="room-bar-track"><div class="room-bar-fill" id="bar3" style="width: 0%;"></div></div>
            <div class="room-bar-val" id="val3">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">📢 全局运营跑马灯广播</div>
        <input type="text" class="input-box" id="noticeInput" placeholder="输入顶部滚动公告（留空并保存则隐藏）..." />
        <button class="btn-action" id="btnSaveNotice">发布公告</button>
      </div>
    </div>

    <!-- 底部：弹幕内容审核与删除 -->
    <div class="card">
      <div class="section-title">
        <span>🛡️ 弹幕内容实时治理</span>
        <div style="display: flex; gap: 10px; align-items: center;">
          <select class="select-room" id="selectRoom">
            <option value="1">苏州猫岛</option>
            <option value="2">沛霖</option>
            <option value="3">南庄</option>
          </select>
          <button class="btn-danger" id="btnClearRoom">清空此房间全部留言</button>
        </div>
      </div>
      <div class="comment-list" id="adminCommentList">
        <div style="text-align: center; color: #8b949e; padding: 20px;">正在拉取数据...</div>
      </div>
    </div>
  </div>

  <script>
    const API_ENDPOINT = "https://maomao-live-api.yuangchen16.workers.dev";
    let adminToken = localStorage.getItem("maomao_admin_token") || "";

    const authOverlay = document.getElementById("authOverlay");
    const adminKeyInput = document.getElementById("adminKeyInput");
    const btnAuth = document.getElementById("btnAuth");
    const btnRefresh = document.getElementById("btnRefresh");
    const selectRoom = document.getElementById("selectRoom");
    const adminCommentList = document.getElementById("adminCommentList");
    const btnSaveNotice = document.getElementById("btnSaveNotice");
    const noticeInput = document.getElementById("noticeInput");
    const btnClearRoom = document.getElementById("btnClearRoom");

    if (adminToken) {
      authOverlay.style.display = "none";
      loadAllData();
    }

    btnAuth.addEventListener("click", () => {
      const val = adminKeyInput.value.trim();
      if (!val) return;
      adminToken = val;
      localStorage.setItem("maomao_admin_token", val);
      authOverlay.style.display = "none";
      loadAllData();
    });

    async function loadStats() {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/stats`, {
          headers: { "X-Admin-Key": adminToken }
        });
        if (res.status === 401) {
          alert("密钥错误，请重新输入");
          localStorage.removeItem("maomao_admin_token");
          location.reload();
          return;
        }
        const json = await res.json();
        const d = json.data;

        document.getElementById("uvToday").textContent = d.uvToday.toLocaleString();
        document.getElementById("uvTotal").textContent = d.uvTotal.toLocaleString();
        document.getElementById("pvToday").textContent = d.pvToday.toLocaleString();
        document.getElementById("pvTotal").textContent = d.pvTotal.toLocaleString();
        document.getElementById("appToday").textContent = d.appClicksToday.toLocaleString();
        document.getElementById("appTotal").textContent = d.appClicksTotal.toLocaleString();
        document.getElementById("commTotal").textContent = d.commentsTotal.toLocaleString();
        document.getElementById("snapTotal").textContent = d.snapshotsTotal.toLocaleString();
        document.getElementById("likeTotal").textContent = d.dblclicksTotal.toLocaleString();

        const v1 = d.roomViews["1"] || 0;
        const v2 = d.roomViews["2"] || 0;
        const v3 = d.roomViews["3"] || 0;
        const max = Math.max(v1, v2, v3, 1);

        document.getElementById("val1").textContent = v1;
        document.getElementById("val2").textContent = v2;
        document.getElementById("val3").textContent = v3;
        document.getElementById("bar1").style.width = `${(v1 / max) * 100}%`;
        document.getElementById("bar2").style.width = `${(v2 / max) * 100}%`;
        document.getElementById("bar3").style.width = `${(v3 / max) * 100}%`;
      } catch (e) {}
    }

    async function loadNotice() {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/notice`);
        const json = await res.json();
        if (json && json.notice) noticeInput.value = json.notice;
      } catch (e) {}
    }

    btnSaveNotice.addEventListener("click", async () => {
      const text = noticeInput.value.trim();
      try {
        const res = await fetch(`${API_ENDPOINT}/api/notice`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Key": adminToken },
          body: JSON.stringify({ text })
        });
        const json = await res.json();
        alert(json.msg || "保存成功！");
      } catch (e) {
        alert("网络异常");
      }
    });

    async function loadComments() {
      const roomId = selectRoom.value;
      try {
        const res = await fetch(`${API_ENDPOINT}/api/comments?room=${roomId}`, { cache: "no-store" });
        const json = await res.json();
        const list = json.comments || [];

        adminCommentList.innerHTML = "";
        if (list.length === 0) {
          adminCommentList.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 20px;">当前房间暂无留言</div>';
          return;
        }

        list.slice().reverse().forEach(c => {
          const row = document.createElement("div");
          row.className = "comment-row";

          row.innerHTML = `
            <div>
              <span class="c-user">${c.name}:</span>
              <span class="c-text">${c.text}</span>
              <span class="c-time">${c.time || ''}</span>
            </div>
          `;

          const btnDel = document.createElement("button");
          btnDel.className = "btn-danger";
          btnDel.textContent = "删除";
          btnDel.addEventListener("click", () => deleteComment(roomId, c.id));

          row.appendChild(btnDel);
          adminCommentList.appendChild(row);
        });
      } catch (e) {}
    }

    async function deleteComment(roomId, commentId) {
      if (!confirm("确定要删除这条留言吗？")) return;
      try {
        const res = await fetch(`${API_ENDPOINT}/api/admin/comments/delete`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Key": adminToken },
          body: JSON.stringify({ roomId, commentId })
        });
        loadComments();
      } catch (e) {}
    }

    btnClearRoom.addEventListener("click", async () => {
      const roomId = selectRoom.value;
      if (!confirm(`确定要清空 机位${roomId} 的全部历史留言吗？此操作不可恢复！`)) return;
      try {
        await fetch(`${API_ENDPOINT}/api/admin/comments/clear`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Key": adminToken },
          body: JSON.stringify({ roomId })
        });
        loadComments();
      } catch (e) {}
    });

    selectRoom.addEventListener("change", loadComments);
    btnRefresh.addEventListener("click", loadAllData);

    function loadAllData() {
      loadStats();
      loadNotice();
      loadComments();
    }
  </script>
</body>
</html>
