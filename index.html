<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>毛毛星球 | 流浪猫云投喂 & 慢直播</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
  <style>
    :root {
      --primary: #ff6b81;
      --primary-hover: #ff4757;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 30px;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 顶部滚动公告 */
    .notice-bar {
      display: none;
      background: rgba(255, 107, 129, 0.15);
      border: 1px solid rgba(255, 107, 129, 0.3);
      color: #ff8597;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    /* 顶部机位切换 */
    .room-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .room-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .room-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 播放器容器 */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 飘屏弹幕层 */
    .danmu-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .danmu-item {
      position: absolute;
      white-space: nowrap;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      animation: danmuMove 7s linear forwards;
    }

    @keyframes danmuMove {
      from { transform: translateX(720px); }
      to { transform: translateX(-100%); }
    }

    /* 互动快捷操作条 */
    .quick-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover { background: #334155; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    /* 弹幕聊天列表 */
    .chat-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 280px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .chat-item {
      line-height: 1.4;
      word-break: break-all;
    }

    .chat-user {
      color: #38bdf8;
      font-weight: 700;
      margin-right: 6px;
    }

    .chat-text {
      color: var(--text);
    }

    .chat-time {
      color: #64748b;
      font-size: 11px;
      margin-left: 6px;
    }

    /* 弹幕输入框条 */
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
    }

    input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; }

    /* 拍立得生成海报浮层 */
    .poster-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .poster-modal.active { display: flex; }
    .poster-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      max-width: 320px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .poster-card img { width: 100%; border-radius: 8px; display: block; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 公告通知栏 -->
    <div class="notice-bar" id="noticeBar"></div>

    <!-- 机位切换 -->
    <div class="room-tabs" id="roomTabs">
      <div class="room-tab active" data-room="1">1号 - 苏州猫岛</div>
      <div class="room-tab" data-room="2">2号 - 沛霖机位</div>
      <div class="room-tab" data-room="3">3号 - 南庄机位</div>
    </div>

    <!-- 直播视频区域 -->
    <div class="video-wrapper" id="videoWrapper">
      <video id="liveVideo" autoplay playsinline muted></video>
      <div class="danmu-container" id="danmuContainer"></div>
    </div>

    <!-- 互动按钮区 -->
    <div class="quick-actions">
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-primary" id="btnGongde" type="button">🐟 功德+1</button>
        <button class="btn" id="btnSnapshot" type="button">📷 拍立得抓拍</button>
      </div>
      <div style="font-size: 12px; color: var(--text-muted);">
        当前机位: <span id="currentRoomText" style="color: var(--text); font-weight: 600;">1号房间</span>
      </div>
    </div>

    <!-- 实时聊天室 -->
    <div class="chat-box">
      <div class="chat-list" id="chatList"></div>
      <div class="chat-input-bar">
        <input type="text" id="userNameInput" placeholder="昵称" style="width: 85px;" maxlength="12" />
        <input type="text" id="commentInput" placeholder="发条弹幕互动一下吧..." style="flex: 1;" maxlength="60" />
        <button class="btn btn-primary" id="btnSend" type="button">发送</button>
      </div>
    </div>
  </div>

  <!-- 拍立得海报弹窗 -->
  <div class="poster-modal" id="posterModal">
    <div class="poster-card">
      <img id="posterImg" alt="猫咪抓拍海报" />
      <div style="font-size: 12px; color: #475569; font-weight: 600;">长按图片保存或分享给好友</div>
      <button class="btn btn-primary" style="width: 100%;" id="btnClosePoster" type="button">关闭</button>
    </div>
  </div>

  <div class="toast" id="toastBox">提示内容</div>

  <script>
    const API_ENDPOINT = "https://maomao-live-api.yuangchen16.workers.dev";

    let currentRoomId = "1";
    let hlsInstance = null;
    let roomStreams = {};
    let lastCommentId = "";
    let pollInterval = null;

    const video = document.getElementById("liveVideo");
    const chatList = document.getElementById("chatList");
    const danmuContainer = document.getElementById("danmuContainer");
    const toastBox = document.getElementById("toastBox");
    const commentInput = document.getElementById("commentInput");
    const userNameInput = document.getElementById("userNameInput");

    // 从本地缓存恢复昵称
    userNameInput.value = localStorage.getItem("maomao_nickname") || "";

    function showToast(msg) {
      toastBox.textContent = msg;
      toastBox.classList.add("show");
      setTimeout(() => toastBox.classList.remove("show"), 2000);
    }

    // ==========================================
    // 1. 获取房间直播流并播放
    // ==========================================
    async function initRooms() {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/rooms`);
        const json = await res.json();
        if (json.code === 200 && Array.isArray(json.rooms)) {
          json.rooms.forEach(r => {
            roomStreams[r.id] = r.hlsUrl;
          });
          playRoomStream(currentRoomId);
        }
      } catch (e) {
        showToast("直播流调度连接失败");
      }
    }

    function playRoomStream(roomId) {
      const hlsUrl = roomStreams[roomId];
      if (!hlsUrl) return;

      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(hlsUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = hlsUrl;
        video.play().catch(() => {});
      }
    }

    // ==========================================
    // 2. 弹幕拉取、渲染与漂字
    // ==========================================
    async function fetchComments() {
      try {
        const url = `${API_ENDPOINT}/api/comments?room=${currentRoomId}${lastCommentId ? `&since=${lastCommentId}` : ""}`;
        const res = await fetch(url);
        const json = await res.json();

        if (json.code === 200 && Array.isArray(json.comments)) {
          json.comments.forEach(c => {
            renderChatMessage(c);
            createDanmu(c.text);
            lastCommentId = c.id;
          });
          if (json.comments.length > 0) {
            chatList.scrollTop = chatList.scrollHeight;
          }
        }
      } catch(e) {}
    }

    // 采用 textContent 安全渲染，彻底杜绝 XSS 注入风险
    function renderChatMessage(c) {
      const item = document.createElement("div");
      item.className = "chat-item";

      const user = document.createElement("span");
      user.className = "chat-user";
      user.textContent = (c.name || "热心猫友") + ":";

      const msg = document.createElement("span");
      msg.className = "chat-text";
      msg.textContent = c.text;

      const time = document.createElement("span");
      time.className = "chat-time";
      time.textContent = c.time ? c.time.slice(0, 5) : "";

      item.appendChild(user);
      item.appendChild(msg);
      item.appendChild(time);
      chatList.appendChild(item);
    }

    function createDanmu(text) {
      if (!text) return;
      const el = document.createElement("div");
      el.className = "danmu-item";
      el.textContent = text;
      el.style.top = `${Math.floor(Math.random() * 60) + 10}%`;
      danmuContainer.appendChild(el);
      setTimeout(() => el.remove(), 7200);
    }

    // ==========================================
    // 3. 弹幕发送 (前置校验，移除蜜罐字段)
    // ==========================================
    document.getElementById("btnSend").addEventListener("click", sendComment);
    commentInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendComment();
    });

    async function sendComment() {
      const text = commentInput.value.trim();
      const name = userNameInput.value.trim() || "热心猫友";

      if (!text) {
        showToast("内容不能为空哦~");
        return;
      }
      if (text.length > 60) {
        showToast("弹幕不能超过60个字~");
        return;
      }

      localStorage.setItem("maomao_nickname", name);

      try {
        const res = await fetch(`${API_ENDPOINT}/api/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            roomId: String(currentRoomId),
            name: name.slice(0, 12),
            text: text
          })
        });

        const json = await res.json();
        if (res.status === 200 && json.code === 200) {
          commentInput.value = "";
          renderChatMessage(json.data);
          createDanmu(json.data.text);
          lastCommentId = json.data.id;
          chatList.scrollTop = chatList.scrollHeight;
        } else {
          showToast(json.msg || "发送失败");
        }
      } catch (e) {
        showToast("网络请求异常");
      }
    }

    // ==========================================
    // 4. 高频互动防抖合并上报 (功德点击)
    // ==========================================
    let dblclickDebounceTimer = null;
    document.getElementById("btnGongde").addEventListener("click", () => {
      createDanmu("🐟 功德 +1 喵~");
      showToast("功德 +1 喵~");

      // 1 秒内连续点击仅上报最后一次，节省 90% 接口与 KV 写入
      if (dblclickDebounceTimer) clearTimeout(dblclickDebounceTimer);
      dblclickDebounceTimer = setTimeout(() => {
        fetch(`${API_ENDPOINT}/api/track`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "dblclick" })
        }).catch(() => {});
      }, 1000);
    });

    // ==========================================
    // 5. 纯前端拍立得海报生成 (0 服务器算力开销)
    // ==========================================
    document.getElementById("btnSnapshot").addEventListener("click", () => {
      if (video.videoWidth === 0) {
        showToast("画面正在加载中，请稍候再试~");
        return;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 400;
      canvas.height = 360;

      // 绘制白色拍立得卡纸
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 绘制视频帧截图
      ctx.drawImage(video, 20, 20, 360, 240);

      // 绘制印章水印
      ctx.fillStyle = "#1e293b";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("🐾 毛毛星球 · 抓拍纪念", 20, 290);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "12px sans-serif";
      ctx.fillText(new Date().toLocaleString("zh-CN"), 20, 315);

      try {
        const posterUrl = canvas.toDataURL("image/png");
        document.getElementById("posterImg").src = posterUrl;
        document.getElementById("posterModal").classList.add("active");

        // 异步静默埋点
        fetch(`${API_ENDPOINT}/api/track`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "snapshot" })
        }).catch(() => {});
      } catch (e) {
        showToast("抓拍失败：视频流跨域保护中");
      }
    });

    document.getElementById("btnClosePoster").addEventListener("click", () => {
      document.getElementById("posterModal").classList.remove("active");
    });

    // ==========================================
    // 6. 房间切换与公告加载
    // ==========================================
    document.querySelectorAll(".room-tab").forEach(tab => {
      tab.addEventListener("click", (e) => {
        const rid = e.target.getAttribute("data-room");
        if (rid === currentRoomId) return;

        document.querySelectorAll(".room-tab").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");

        currentRoomId = rid;
        document.getElementById("currentRoomText").textContent = `${rid}号房间`;
        chatList.innerHTML = "";
        lastCommentId = "";

        playRoomStream(currentRoomId);
        fetchComments();

        // 机位切换埋点
        fetch(`${API_ENDPOINT}/api/track`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "room_view", roomId: String(currentRoomId) })
        }).catch(() => {});
      });
    });

    async function loadNotice() {
      try {
        const res = await fetch(`${API_ENDPOINT}/api/notice`);
        const json = await res.json();
        if (json.notice && json.notice.trim()) {
          const bar = document.getElementById("noticeBar");
          bar.textContent = `📢 ${json.notice.trim()}`;
          bar.style.display = "block";
        }
      } catch(e) {}
    }

    // ==========================================
    // 7. 启动与静默 PV 埋点
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      initRooms();
      loadNotice();
      fetchComments();

      // 启动 3 秒弹幕轮询
      pollInterval = setInterval(fetchComments, 3000);

      // 页面 PV 埋点
      fetch(`${API_ENDPOINT}/api/track`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "pv" })
      }).catch(() => {});
    });
  </script>
</body>
</html>
