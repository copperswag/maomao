<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>毛毛星球 MeowHub | 智能养宠</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 30%);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 28px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 99px;
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .hero-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-sub);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .live-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .live-layout {
        grid-template-columns: 1fr;
      }
    }

    .room-sidebar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      padding: 4px 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .room-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .room-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .room-btn.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(5, 150, 105, 0.24));
      border-color: rgba(16, 185, 129, 0.5);
      color: #fff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15);
    }

    .room-btn .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .room-btn.active .status-indicator {
      color: var(--accent-green);
    }

    .player-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .danmaku-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 8;
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 8px rgba(0, 0, 0, 0.7);
      animation: danmaku-move 7s linear forwards;
    }

    .danmaku-item.is-me {
      color: #34d399;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.55);
      border-radius: 99px;
      padding: 3px 12px;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
    }

    @keyframes danmaku-move {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }

    .tap-heart {
      position: absolute;
      font-size: 32px;
      pointer-events: none;
      z-index: 12;
      animation: float-up-fade 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    @keyframes float-up-fade {
      0% { transform: translate(-50%, -50%) scale(0.6) rotate(0deg); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.3) rotate(-8deg); opacity: 1; }
      100% { transform: translate(-50%, -150px) scale(1) rotate(12deg); opacity: 0; }
    }

    .controls-overlay {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .player-ctrl-btn {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .player-ctrl-btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    .card-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: var(--text-main);
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .empty-copy {
      font-size: 13px;
      color: var(--text-sub);
    }

    .player-bar {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      border-top: 1px solid var(--card-border);
    }

    .current-room-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .chat-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chat-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-messages {
      height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 6px;
      margin-bottom: 14px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .message-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .message-item.is-me {
      background: rgba(16, 185, 129, 0.09);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .msg-user {
      color: var(--accent-green);
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .msg-badge-me {
      background: var(--accent-green);
      color: #090a0f;
      font-size: 10px;
      font-weight: 800;
      padding: 0 4px;
      border-radius: 4px;
      line-height: 14px;
    }

    .msg-time {
      color: var(--text-sub);
      font-size: 11px;
      margin-left: auto;
      white-space: nowrap;
    }

    .msg-text {
      color: var(--text-main);
      word-break: break-all;
    }

    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }
    .quick-chips::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip-btn:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    .chat-input-bar {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .nickname-wrapper {
      position: relative;
      width: 155px;
      flex-shrink: 0;
    }

    .chat-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .chat-input:focus {
      border-color: var(--accent-green);
      background: rgba(255, 255, 255, 0.07);
    }

    .input-name { padding-right: 32px; }

    .btn-dice {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
      opacity: 0.65;
      padding: 4px;
      transition: all 0.2s;
    }

    .btn-dice:hover {
      opacity: 1;
      transform: translateY(-50%) rotate(45deg);
    }

    .input-text { flex: 1; }

    .hp-field {
      opacity: 0;
      position: absolute;
      top: 0;
      left: 0;
      height: 0;
      width: 0;
      z-index: -1;
      pointer-events: none;
    }

    .btn-send {
      background: var(--accent-green);
      color: #090a0f;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      min-width: 65px;
    }

    .btn-send:hover:not(:disabled) {
      background: var(--accent-green-hover);
    }

    .btn-send:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      cursor: not-allowed;
    }

    .footer-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .footer-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .chat-input-bar { flex-direction: column; }
      .nickname-wrapper { width: 100%; }
    }

    .btn-main {
      background: linear-gradient(135deg, #ffffff, #e5e7eb);
      color: #090a0f;
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-main:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <div class="logo-icon">🐾</div>
        <div class="logo-text">MeowHub <span style="font-weight: 300; opacity: 0.5;">Live</span></div>
      </div>
      <div class="badge-live">
        <div class="pulse-dot"></div>
        <span id="onlineCount">3 直播间在线</span>
      </div>
    </header>

    <h1 class="hero-title">毛毛星球 MeowHub | 智能养宠</h1>
    <p class="hero-desc">不论爱宠、更懂爱它。定点喂养、实时直播与智能看护系统。</p>

    <div class="live-layout">
      <div class="room-sidebar">
        <div class="sidebar-title">切换直播间</div>
        <div id="roomButtonList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <div class="player-container">
        <div class="video-wrapper" id="videoWrapper">
          <video id="mainVideo" autoplay muted playsinline controlsList="nodownload"></video>
          <div class="danmaku-container" id="danmakuBox"></div>
          
          <div class="controls-overlay">
            <button class="player-ctrl-btn" id="danmakuToggleBtn" type="button">💬 弹幕: 开</button>
            <button class="player-ctrl-btn" id="audioBtn" type="button">🔇 开启声音</button>
          </div>

          <div class="card-empty" id="playerEmpty">
            <div>
              <div class="empty-title" id="emptyTitle">正在连线设备...</div>
              <p class="empty-copy" id="emptyCopy">唤醒视频流中，请稍候...</p>
            </div>
          </div>
        </div>
        <div class="player-bar">
          <span class="current-room-name" id="currentRoomTitle">加载中...</span>
          <span class="badge-live">
            <div class="pulse-dot"></div>
            <span>LIVE 实时直连</span>
          </span>
        </div>
      </div>
    </div>

    <!-- 互动留言板 -->
    <div class="chat-section">
      <div class="chat-header">
        <div class="chat-title">💬 实时猫友互动区</div>
        <div style="font-size: 12px; color: var(--text-sub);">双击视频画面有吸猫爱心 🐾</div>
      </div>

      <div class="chat-messages" id="chatList">
        <div style="color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 40px;">正在加载互动...</div>
      </div>

      <div class="quick-chips">
        <button class="chip-btn" type="button">🐱 咪咪好乖</button>
        <button class="chip-btn" type="button">🍗 加餐加餐</button>
        <button class="chip-btn" type="button">👀 正在暗中观察</button>
        <button class="chip-btn" type="button">❤️ 来看小可爱啦</button>
        <button class="chip-btn" type="button">🐟 赛博云喂猫</button>
      </div>

      <form class="chat-input-bar" id="chatForm">
        <input type="text" name="hp_website" id="hpWebsite" class="hp-field" tabindex="-1" autocomplete="off" />
        
        <div class="nickname-wrapper">
          <input type="text" class="chat-input input-name" id="nameInput" placeholder="昵称" maxlength="12" />
          <button type="button" class="btn-dice" id="btnRandomName" title="随机换一个名字">🎲</button>
        </div>

        <input type="text" class="chat-input input-text" id="textInput" placeholder="说点什么吧，按回车发送弹幕..." maxlength="60" required />
        <button type="submit" class="btn-send" id="btnSend">发送</button>
      </form>
    </div>

    <div class="footer-box">
      <div>
        <h3 style="font-size: 15px; margin-bottom: 4px;">毛毛星球 App</h3>
        <p style="color: var(--text-sub); font-size: 13px;">提供定点云端投喂、远程看护与领养服务</p>
      </div>
      <a href="https://agreement.meowhub.cn/live_room_share.html" target="_blank" rel="noopener noreferrer" class="btn-main">下载 App</a>
    </div>

    <div class="footer-box">
      <div>
        <h3 style="font-size: 15px; margin-bottom: 4px;">🐠 赛博互动鱼缸</h3>
        <p style="color: var(--text-sub); font-size: 13px;">画一条小鱼进入公共鱼缸，参与社区互动与积分彩蛋！</p>
      </div>
      <a href="https://copperswag.github.io/fishes/" target="_blank" rel="noopener noreferrer" class="btn-main">去画鱼 / 逛鱼缸</a>
    </div>

    <footer>
      <div>© 2026 毛毛星球</div>
      <div style="margin-top: 6px;">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026010549号-2</a>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script>
    const API_ENDPOINT = "https://maomao-live-api.yuangchen16.workers.dev";

    const video = document.getElementById("mainVideo");
    const videoWrapper = document.getElementById("videoWrapper");
    const audioBtn = document.getElementById("audioBtn");
    const danmakuToggleBtn = document.getElementById("danmakuToggleBtn");
    const danmakuBox = document.getElementById("danmakuBox");
    const chatList = document.getElementById("chatList");
    const chatForm = document.getElementById("chatForm");
    const nameInput = document.getElementById("nameInput");
    const textInput = document.getElementById("textInput");
    const btnRandomName = document.getElementById("btnRandomName");
    const btnSend = document.getElementById("btnSend");
    const hpWebsite = document.getElementById("hpWebsite");
    const playerEmpty = document.getElementById("playerEmpty");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyCopy = document.getElementById("emptyCopy");
    const currentRoomTitle = document.getElementById("currentRoomTitle");
    const roomButtonList = document.getElementById("roomButtonList");

    let hls = null;
    let roomList = [];
    let currentRoomId = "";
    let danmakuEnabled = true;
    let seenCommentIds = new Set();
    let pollTimer = null;
    let cooldownTimer = null;

    const ADJECTIVES = ["干饭的", "贪睡的", "软萌的", "机智的", "威风的", "好奇的", "粘人的", "调皮的", "高冷的", "元气的"];
    const CAT_NAMES = ["小橘", "三花", "奶牛猫", "布偶", "狸花", "金渐层", "银渐层", "大胖橘", "无毛猫", "小黑猫"];

    function generateNewNickname() {
      const adj = ADJECTIVES[Math.floor(Math.random() * ADJECTIVES.length)];
      const cat = CAT_NAMES[Math.floor(Math.random() * CAT_NAMES.length)];
      const num = Math.floor(Math.random() * 900) + 100;
      const nick = `${adj}${cat}#${num}`;
      localStorage.setItem("meow_user_nickname", nick);
      return nick;
    }

    function getOrCreateUserNickname() {
      let saved = localStorage.getItem("meow_user_nickname");
      if (!saved) saved = generateNewNickname();
      return saved;
    }

    btnRandomName.addEventListener("click", () => {
      nameInput.value = generateNewNickname();
    });

    nameInput.addEventListener("change", () => {
      const val = nameInput.value.trim();
      if (val) localStorage.setItem("meow_user_nickname", val);
    });

    document.querySelectorAll(".chip-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        textInput.value = btn.textContent.trim();
        textInput.focus();
      });
    });

    const ICONS = ["💖", "🐾", "✨", "😻", "🍗", "🐟"];
    videoWrapper.addEventListener("dblclick", (e) => {
      const rect = videoWrapper.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const heart = document.createElement("div");
      heart.className = "tap-heart";
      heart.textContent = ICONS[Math.floor(Math.random() * ICONS.length)];
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      videoWrapper.appendChild(heart);

      heart.addEventListener("animationend", () => heart.remove());
    });

    audioBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      audioBtn.innerHTML = video.muted ? '🔇 开启声音' : '🔊 静音';
    });

    danmakuToggleBtn.addEventListener("click", () => {
      danmakuEnabled = !danmakuEnabled;
      danmakuBox.style.display = danmakuEnabled ? "block" : "none";
      danmakuToggleBtn.textContent = danmakuEnabled ? "💬 弹幕: 开" : "💬 弹幕: 关";
    });

    video.addEventListener("timeupdate", () => {
      if (video.currentTime > 0) playerEmpty.style.display = "none";
    });

    video.addEventListener("playing", () => {
      playerEmpty.style.display = "none";
    });

    function shootDanmaku(text, isMe = false) {
      if (!danmakuEnabled) return;
      const el = document.createElement("div");
      el.className = `danmaku-item ${isMe ? 'is-me' : ''}`;
      el.textContent = text;
      const topPos = Math.floor(Math.random() * 60) + 15;
      el.style.top = `${topPos}%`;
      danmakuBox.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }

// 渲染留言板与弹幕（彻底解除死锁）
    function renderComments(comments, isInitial = false) {
      // 1. 如果是初次加载，先把容器里的“正在加载...”清空
      if (isInitial) {
        chatList.innerHTML = "";
      }

      // 2. 如果没有任何评论数据
      if (!comments || comments.length === 0) {
        if (chatList.children.length === 0) {
          chatList.innerHTML = '<div style="color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 40px;">暂无互动消息，快来发第一条吧~</div>';
        }
        return;
      }

      // 3. 如果当前展示的是“暂无互动消息”或“正在加载”，将其清除
      const placeholder = chatList.querySelector('div[style*="text-align: center"]');
      if (placeholder) {
        placeholder.remove();
      }

      const myCurrentName = nameInput.value.trim();
      const isAtBottom = chatList.scrollHeight - chatList.scrollTop - chatList.clientHeight < 50;

      comments.forEach(c => {
        if (seenCommentIds.has(c.id)) return;
        seenCommentIds.add(c.id);

        const isMe = Boolean(c.isLocal) || (myCurrentName && c.name === myCurrentName);

        const row = document.createElement("div");
        row.className = `message-item ${isMe ? 'is-me' : ''}`;

        const userSpan = document.createElement("span");
        userSpan.className = "msg-user";
        userSpan.textContent = `${c.name || '热心猫友'}:`;

        if (isMe) {
          const badge = document.createElement("span");
          badge.className = "msg-badge-me";
          badge.textContent = "我";
          userSpan.appendChild(badge);
        }

        const textSpan = document.createElement("span");
        textSpan.className = "msg-text";
        textSpan.textContent = ` ${c.text || ''}`;

        const timeSpan = document.createElement("span");
        timeSpan.className = "msg-time";
        timeSpan.textContent = c.time || '';

        row.appendChild(userSpan);
        row.appendChild(textSpan);
        row.appendChild(timeSpan);

        chatList.appendChild(row);

        // 如果不是初次进房，也不是自己刚发的，就飘出实时弹幕
        if (!isInitial && !c.isLocal) {
          shootDanmaku(`${c.name}: ${c.text}`, isMe);
        }
      });

      // 初次进入时，回放最近 8 条弹幕
      if (isInitial && comments.length > 0) {
        const historyList = comments.slice(-8);
        historyList.forEach((item, index) => {
          setTimeout(() => {
            const isMe = (myCurrentName && item.name === myCurrentName);
            shootDanmaku(`${item.name}: ${item.text}`, isMe);
          }, index * 900 + 400);
        });
      }

      if (isAtBottom || isInitial) {
        chatList.scrollTo({ top: chatList.scrollHeight, behavior: 'smooth' });
      }
    }

    // 轮询拉取评论
    async function fetchComments(isInitial = false) {
      if (!currentRoomId) return;
      try {
        const safeRoomId = encodeURIComponent(currentRoomId);
        const res = await fetch(`${API_ENDPOINT}/api/comments?room=${safeRoomId}`, { cache: "no-cache" });
        const data = await res.json();
        if (data && Array.isArray(data.comments)) {
          renderComments(data.comments, isInitial);
        } else {
          renderComments([], isInitial);
        }
      } catch (e) {
        renderComments([], isInitial);
      }
    } else if (isInitial && chatList.children.length === 0) {
          chatList.innerHTML = '<div style="color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 40px;">暂无互动消息，快来发第一条吧~</div>';
        }
      } catch (e) {
        if (isInitial && chatList.children.length === 0) {
          chatList.innerHTML = '<div style="color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 40px;">暂无互动消息，快来发第一条吧~</div>';
        }
      }
    }

    function startCooldown() {
      let timeLeft = 3;
      btnSend.disabled = true;
      btnSend.textContent = `${timeLeft}s`;

      cooldownTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(cooldownTimer);
          btnSend.disabled = false;
          btnSend.textContent = "发送";
        } else {
          btnSend.textContent = `${timeLeft}s`;
        }
      }, 1000);
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (btnSend.disabled) return;

      const text = textInput.value.trim();
      if (!text) return;
      const name = nameInput.value.trim() || getOrCreateUserNickname();
      const hp = hpWebsite ? hpWebsite.value : "";

      textInput.value = "";
      startCooldown();

      shootDanmaku(`${name}: ${text}`, true);

      const localId = "loc_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);
      const localMsg = {
        id: localId,
        name: name,
        text: text,
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        isLocal: true
      };
      renderComments([localMsg], false);

      try {
        const res = await fetch(`${API_ENDPOINT}/api/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ roomId: currentRoomId, name, text, hp_website: hp })
        });
        const json = await res.json();
        if (res.status === 429) {
          alert(json.msg || "发言太快了，请休息几秒~");
          return;
        }
        if (res.status === 403) {
          alert(json.msg || "消息包含敏感词，已被拦截");
          return;
        }
        if (res.status === 400 && json.msg) {
          alert(json.msg);
          return;
        }
        if (json && json.data) {
          seenCommentIds.add(json.data.id);
        }
      } catch (err) {}
    });

    function playStream(roomIndex) {
      const room = roomList[roomIndex];
      if (!room) return;

      currentRoomId = room.id || `room_${room.name}`;
      const roomName = room.name || `直播间 ${roomIndex + 1}`;
      currentRoomTitle.textContent = roomName;

      seenCommentIds.clear();
      chatList.innerHTML = '<div style="color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 40px;">正在加载互动...</div>';
      
      fetchComments(true);

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => fetchComments(false), 3500);

      const allButtons = roomButtonList.querySelectorAll(".room-btn");
      allButtons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === roomIndex);
      });

      playerEmpty.style.display = "grid";
      emptyTitle.textContent = `正在连接 ${roomName}...`;
      emptyCopy.textContent = "正在调取云端视频...";

      if (hls) {
        hls.stopLoad();
        hls.detachMedia();
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.src = "";
      video.load();

      if (!room.hlsUrl) {
        emptyTitle.textContent = `${roomName} 待机中`;
        emptyCopy.textContent = "暂无活跃推流，请切换其他直播间";
        return;
      }

      if (window.Hls && window.Hls.isSupported()) {
        hls = new window.Hls({
          enableWorker: true,
          lowLatencyMode: true,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 10,
          levelLoadingTimeOut: 15000,
          levelLoadingMaxRetry: 10,
          fragLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 10
        });

        hls.loadSource(room.hlsUrl);
        hls.attachMedia(video);

        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          video.muted = true;
          video.play().catch(() => {});
        });

        hls.on(window.Hls.Events.ERROR, (_event, data) => {
          if (data && data.fatal) {
            switch (data.type) {
              case window.Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case window.Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                break;
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = room.hlsUrl;
        video.play().catch(() => {});
      }
    }

    async function initPage() {
      try {
        nameInput.value = getOrCreateUserNickname();

        const response = await fetch(API_ENDPOINT, { cache: "no-cache" });
        const data = await response.json();
        let rawRooms = data.rooms || [];

        if (rawRooms.length === 0) {
          emptyTitle.textContent = "暂无在线直播间";
          emptyCopy.textContent = "请稍后再试";
          return;
        }

        const randomIndex = Math.floor(Math.random() * rawRooms.length);
        const featuredRoom = rawRooms.splice(randomIndex, 1)[0];
        roomList = [featuredRoom, ...rawRooms];

        document.getElementById("onlineCount").textContent = `${roomList.length} 直播间在线`;
        roomButtonList.innerHTML = "";

        roomList.forEach((room, idx) => {
          const btn = document.createElement("button");
          btn.className = `room-btn ${idx === 0 ? 'active' : ''}`;

          btn.innerHTML = `
            <span>${room.name}</span>
            <span class="status-indicator">
              <span class="pulse-dot"></span>
              LIVE
            </span>
          `;

          btn.addEventListener("click", () => {
            playStream(idx);
          });

          roomButtonList.appendChild(btn);
        });

        // 确保列表构建完成后再切流加载数据
        playStream(0);
      } catch (err) {
        emptyTitle.textContent = "服务连接异常";
        emptyCopy.textContent = "请检查网络或稍后刷新重试";
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (hls && hls.liveSyncPosition) {
          const latency = hls.liveSyncPosition - video.currentTime;
          if (latency > 3) {
            video.currentTime = hls.liveSyncPosition;
          }
          video.play().catch(() => {});
        } else if (video.paused) {
          video.play().catch(() => {});
        }
      }
    });

    initPage();
  </script>
</body>
</html>
