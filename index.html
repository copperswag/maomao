<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>毛毛星球 MeowHub | 智能养宠</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-green: #10b981;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 30%);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 32px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 99px;
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-sub);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .video-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .video-wrapper {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .audio-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .card-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: var(--text-main);
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    .card-empty[hidden] { display: none; }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .empty-copy {
      font-size: 12px;
      color: var(--text-sub);
    }

    .card-info {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
    }

    .cam-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .cam-status {
      font-size: 12px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .footer-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }

    .btn-main {
      background: linear-gradient(135deg, #ffffff, #e5e7eb);
      color: #090a0f;
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-main:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <div class="logo-icon">🐾</div>
        <div class="logo-text">MeowHub <span style="font-weight: 300; opacity: 0.5;">Live</span></div>
      </div>
      <div class="badge-live">
        <div class="pulse-dot"></div>
        <span id="onlineCount">3 CAM ONLINE</span>
      </div>
    </header>

    <h1 class="hero-title">毛毛星球 MeowHub | 智能养宠</h1>
    <p class="hero-desc">不论爱宠、更懂爱它。定点喂养、实时直播与智能看护系统。</p>

    <div class="grid" id="liveGrid"></div>

    <div class="footer-box">
      <div>
        <h3 style="font-size: 15px; margin-bottom: 4px;">毛毛星球 App</h3>
        <p style="color: var(--text-sub); font-size: 13px;">提供定点云端投喂、远程看护与领养服务</p>
      </div>
      <a href="https://agreement.meowhub.cn/live_room_share.html" target="_blank" rel="noopener noreferrer" class="btn-main">下载 App</a>
    </div>

    <div class="footer-box">
      <div>
        <h3 style="font-size: 15px; margin-bottom: 4px;">🐠 赛博互动鱼缸</h3>
        <p style="color: var(--text-sub); font-size: 13px;">画一条小鱼进入公共鱼缸，参与社区互动与积分彩蛋！</p>
      </div>
      <a href="https://copperswag.github.io/fishes/" target="_blank" rel="noopener noreferrer" class="btn-main">去画鱼 / 逛鱼缸</a>
    </div>

    <footer>
      <div>© 2026 毛毛星球</div>
      <div style="margin-top: 6px;">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026010549号-2</a>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script>
    const API_ENDPOINT = "https://maomao-live-api.yuangchen16.workers.dev";
    const liveGrid = document.getElementById("liveGrid");
    const hlsInstances = [];

    function setCameraStatus(card, text, isLive) {
      const status = card.querySelector(".cam-status");
      if (status) {
        status.textContent = text;
        status.style.color = isLive ? "var(--accent-green)" : "var(--text-sub)";
      }
    }

    function createVideoCard(room, index) {
      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <div class="video-wrapper">
          <video id="liveVideo_${index}" autoplay muted playsinline preload="auto"></video>
          <button class="audio-btn" type="button">🔇 开启声音</button>
          <div class="card-empty">
            <div>
              <div class="empty-title">正在连线设备...</div>
              <p class="empty-copy">唤醒边缘视频流中，请稍候...</p>
            </div>
          </div>
        </div>
        <div class="card-info">
          <span class="cam-title">CAM 0${room.name}</span>
          <span class="cam-status">连接中</span>
        </div>
      `;

      const video = card.querySelector("video");
      const audioBtn = card.querySelector(".audio-btn");

      audioBtn.addEventListener("click", () => {
        video.muted = !video.muted;
        audioBtn.innerHTML = video.muted ? '🔇 开启声音' : '🔊 静音';
      });

      return card;
    }

    // 针对每台设备创建独立的 HLS 实例与后台重连
    function initHlsStream(video, url, card) {
      if (!url) {
        const empty = card.querySelector(".card-empty");
        empty.querySelector(".empty-title").textContent = "设备待机中";
        empty.querySelector(".empty-copy").textContent = "暂无活跃推流，请稍后刷新";
        return;
      }

      const empty = card.querySelector(".card-empty");

      video.addEventListener("playing", () => {
        empty.hidden = true;
        setCameraStatus(card, "LIVE", true);
      });

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.play().catch(() => {});
        return;
      }

      if (window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({
          enableWorker: true,
          lowLatencyMode: true,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 10,
          levelLoadingTimeOut: 15000,
          levelLoadingMaxRetry: 10,
          fragLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 10
        });

        hlsInstances.push(hls);
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(window.Hls.Events.ERROR, (_event, data) => {
          if (data && data.fatal) {
            switch (data.type) {
              case window.Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case window.Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                setTimeout(() => {
                  hls.loadSource(url);
                  hls.startLoad();
                }, 2000);
                break;
            }
          }
        });
      }
    }

    async function initPage() {
      try {
        const response = await fetch(API_ENDPOINT, { cache: "no-cache" });
        const data = await response.json();
        const rooms = data.rooms || [];

        liveGrid.innerHTML = "";
        document.getElementById("onlineCount").textContent = `${rooms.length} CAM ONLINE`;

        rooms.forEach((room, idx) => {
          const card = createVideoCard(room, idx + 1);
          liveGrid.appendChild(card);
          const video = card.querySelector("video");

          // 错峰 300ms 唤醒，确保多机位全部正常出画面
          setTimeout(() => {
            initHlsStream(video, room.hlsUrl, card);
          }, idx * 300);
        });
      } catch (err) {
        console.error("加载直播房间失败:", err);
      }
    }

    initPage();
  </script>
</body>
</html>
