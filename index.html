<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>毛毛星球 MeowHub | 智能养宠</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-green: #10b981;
      --accent-active: #059669;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 30%);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 28px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 99px;
      color: var(--accent-green);
      font-size: 12px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .hero-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-sub);
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* 左右分栏核心布局 */
    .live-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .live-layout {
        grid-template-columns: 1fr;
      }
    }

    /* 左侧房间切换导航 */
    .room-sidebar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      padding: 4px 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .room-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .room-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .room-btn.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(5, 150, 105, 0.24));
      border-color: rgba(16, 185, 129, 0.5);
      color: #fff;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15);
    }

    .room-btn .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .room-btn.active .status-indicator {
      color: var(--accent-green);
    }

    /* 右侧主画面展示区 */
    .player-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .audio-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .card-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
      color: var(--text-main);
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(4px);
      z-index: 5;
    }

    .card-empty[hidden] { display: none; }

    .empty-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .empty-copy {
      font-size: 13px;
      color: var(--text-sub);
    }

    .player-bar {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      border-top: 1px solid var(--card-border);
    }

    .current-room-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .footer-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .footer-box {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
    }

    .btn-main {
      background: linear-gradient(135deg, #ffffff, #e5e7eb);
      color: #090a0f;
      padding: 10px 22px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-main:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-group">
        <div class="logo-icon">🐾</div>
        <div class="logo-text">MeowHub <span style="font-weight: 300; opacity: 0.5;">Live</span></div>
      </div>
      <div class="badge-live">
        <div class="pulse-dot"></div>
        <span id="onlineCount">3 直播间在线</span>
      </div>
    </header>

    <h1 class="hero-title">毛毛星球 MeowHub | 智能养宠</h1>
    <p class="hero-desc">不论爱宠、更懂爱它。定点喂养、实时直播与智能看护系统。</p>

    <!-- 核心分栏区域 -->
    <div class="live-layout">
      <!-- 左侧机位切换列表 -->
      <div class="room-sidebar">
        <div class="sidebar-title">切换直播间</div>
        <div id="roomButtonList" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <!-- 右侧单屏高清播放器 -->
      <div class="player-container">
        <div class="video-wrapper">
          <video id="mainVideo" autoplay muted playsinline preload="auto"></video>
          <button class="audio-btn" id="audioBtn" type="button">🔇 开启声音</button>
          <div class="card-empty" id="playerEmpty">
            <div>
              <div class="empty-title" id="emptyTitle">正在连线设备...</div>
              <p class="empty-copy" id="emptyCopy">唤醒边缘视频流中，请稍候...</p>
            </div>
          </div>
        </div>
        <div class="player-bar">
          <span class="current-room-name" id="currentRoomTitle">第一直播间</span>
          <span class="badge-live" id="streamBadge">
            <div class="pulse-dot"></div>
            <span>LIVE 实时直连</span>
          </span>
        </div>
      </div>
    </div>

    <div class="footer-box">
      <div>
        <h3 style="font-size: 15px; margin-bottom: 4px;">毛毛星球 App</h3>
        <p style="color: var(--text-sub); font-size: 13px;">提供定点云端投喂、远程看护与领养服务</p>
      </div>
      <a href="https://agreement.meowhub.cn/live_room_share.html" target="_blank" rel="noopener noreferrer" class="btn-main">下载 App</a>
    </div>

    <div class="footer-box">
      <div>
        <h3 style="font-size: 15px; margin-bottom: 4px;">🐠 赛博互动鱼缸</h3>
        <p style="color: var(--text-sub); font-size: 13px;">画一条小鱼进入公共鱼缸，参与社区互动与积分彩蛋！</p>
      </div>
      <a href="https://copperswag.github.io/fishes/" target="_blank" rel="noopener noreferrer" class="btn-main">去画鱼 / 逛鱼缸</a>
    </div>

    <footer>
      <div>© 2026 毛毛星球</div>
      <div style="margin-top: 6px;">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026010549号-2</a>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script>
    const API_ENDPOINT = "https://maomao-live-api.yuangchen16.workers.dev";
    const chineseNumbers = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];

    const video = document.getElementById("mainVideo");
    const audioBtn = document.getElementById("audioBtn");
    const playerEmpty = document.getElementById("playerEmpty");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyCopy = document.getElementById("emptyCopy");
    const currentRoomTitle = document.getElementById("currentRoomTitle");
    const roomButtonList = document.getElementById("roomButtonList");

    let currentHls = null;
    let roomList = [];

    // 音频开关
    audioBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      audioBtn.innerHTML = video.muted ? '🔇 开启声音' : '🔊 静音';
    });

    // 播放中自动移除遮罩
    video.addEventListener("playing", () => {
      playerEmpty.hidden = true;
    });

    // 核心：单流平滑切换函数
    function playRoomStream(roomIndex) {
      const room = roomList[roomIndex];
      if (!room) return;

      const roomLabel = `第${chineseNumbers[roomIndex] || (roomIndex + 1)}直播间`;
      currentRoomTitle.textContent = roomLabel;

      // 切换左侧按钮激活状态
      const allButtons = roomButtonList.querySelectorAll(".room-btn");
      allButtons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === roomIndex);
      });

      // 显示加载提示
      playerEmpty.hidden = false;
      emptyTitle.textContent = `正在连接 ${roomLabel}...`;
      emptyCopy.textContent = "已释放其他机位通道，正在建立视频流...";

      // 彻底销毁上一个流，释放网络与解码器
      if (currentHls) {
        currentHls.destroy();
        currentHls = null;
      }

      if (!room.hlsUrl) {
        emptyTitle.textContent = `${roomLabel} 待机中`;
        emptyCopy.textContent = "暂无活跃推流";
        return;
      }

      // Safari 原生支持
      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = room.hlsUrl;
        video.play().catch(() => {});
        return;
      }

      // Chrome/Edge/通用 Hls.js 引擎
      if (window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({
          enableWorker: true,
          lowLatencyMode: true,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 8,
          levelLoadingTimeOut: 15000,
          levelLoadingMaxRetry: 8,
          fragLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 8
        });

        currentHls = hls;
        hls.loadSource(room.hlsUrl);
        hls.attachMedia(video);

        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(window.Hls.Events.ERROR, (_event, data) => {
          if (data && data.fatal) {
            switch (data.type) {
              case window.Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case window.Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                setTimeout(() => {
                  if (currentHls) {
                    currentHls.loadSource(room.hlsUrl);
                    currentHls.startLoad();
                  }
                }, 2000);
                break;
            }
          }
        });
      }
    }

    async function initPage() {
      try {
        const response = await fetch(API_ENDPOINT, { cache: "no-cache" });
        const data = await response.json();
        roomList = data.rooms || [];

        document.getElementById("onlineCount").textContent = `${roomList.length} 直播间在线`;
        roomButtonList.innerHTML = "";

        // 动态生成左侧切换按钮
        roomList.forEach((room, idx) => {
          const btn = document.createElement("button");
          btn.className = `room-btn ${idx === 0 ? 'active' : ''}`;
          const title = `第${chineseNumbers[idx] || (idx + 1)}直播间`;
          
          btn.innerHTML = `
            <span>${title}</span>
            <span class="status-indicator">
              <span class="pulse-dot"></span>
              LIVE
            </span>
          `;

          btn.addEventListener("click", () => {
            playRoomStream(idx);
          });

          roomButtonList.appendChild(btn);
        });

        // 默认播放第一个房间
        if (roomList.length > 0) {
          playRoomStream(0);
        }
      } catch (err) {
        emptyTitle.textContent = "服务连接异常";
        emptyCopy.textContent = "请检查网络或稍后刷新重试";
      }
    }

    initPage();
  </script>
</body>
</html>
